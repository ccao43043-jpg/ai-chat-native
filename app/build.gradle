plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// 签名：根目录 keystore.properties（不提交 Git，见 .gitignore）存在时用它；否则回退 debug 证书。
//
// 为什么必须有这个文件：Android 只允许「证书完全相同 + versionCode 不小于已装版本」的 APK
// 覆盖安装。此前每次发版都由不同机器/CI 临时环境构建，各自用本机 ~/.android/debug.keystore，
// 结果 v1.3.0 / v1.4.0 / v1.5.0 三份 APK 是三张不同证书（43bed124… / c3831930… / c40e3511…），
// 用户每次升级都必须先卸载（数据全丢）。
//
// 现在 fixed key（SHA-256 A2:28:0D:C1…2F:52）同时用于 debug 与 release，
// 保证「任何一次构建都能覆盖装上一次的构建」。私钥在 D:\android-dev\keystore\ai-chat-release.jks，
// 必须长期保留；丢了就再也无法覆盖升级。
def ksPropsFile = rootProject.file('keystore.properties')
def ksProps = new Properties()
if (ksPropsFile.exists()) { ksPropsFile.withInputStream { ksProps.load(it) } }
def hasKs = ksPropsFile.exists() && ksProps['storeFile']
if (!hasKs) {
    logger.warn('[签名] 未找到 keystore.properties：本次产物用本机 debug 证书，**不能**覆盖安装到用户设备（见 docs/SIGNING.md）')
}

android {
    namespace 'com.aichat.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aichat.app'   // 不可改：覆盖安装
        minSdk 24
        targetSdk 34
        versionCode 162                  // 原生 v1.6.2：召回纳入预算 + 缓存路线一轮一次 + 跨来源软去重 + 体检面板说真话
        versionName '1.6.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        // 固定签名（见文件顶部说明）：debug 与 release 共用，保证跨次构建可覆盖安装
        stable {
            if (hasKs) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (hasKs) signingConfig signingConfigs.stable
        }
        release {
            // R8：release 包开混淆 + 资源裁剪，把 11.7 MB / 16 个 dex 的 debug 包压下来。
            // 规则见 app/proguard-rules.pro（只保留序列化器与枚举，其余按可达性裁掉）。
            // debug 构建不开，免得单测/instrumented 调试时栈被混淆。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKs ? signingConfigs.stable : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    // release 默认会跑 lintVitalRelease，它要联网拉 lint-gradle 的传递依赖；
    // 离线/代理不稳的环境下会让「只是打个包」直接失败。lint 不在本项目的门禁里（门禁是单测 + instrumented）。
    lint { checkReleaseBuilds false; abortOnError false }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
    testOptions {
        unitTests.returnDefaultValues = true
        // CI 上失败时只打一行 "AssertionError at XxxTest.kt:102"，看不出断言内容；
        // 打开完整异常格式后，控制台日志里能直接看到 expected/actual 与栈。
        unitTests.all {
            it.testLogging {
                events("failed")
                exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
                showExceptions = true
                showCauses = true
                showStackTraces = true
            }
        }
    }
    // 旧 WebView 前端（src/main/assets/www）只作 golden 对照与 node 测试的参考实现，不打进 APK
    sourceSets { main { assets.srcDirs = [] } }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.core:core-ktx:1.13.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    // A 的 Compose UI 测试（整合者裁定 #e）
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}
