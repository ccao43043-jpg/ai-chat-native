name: report
# 临时：把单测结果写成 .ci/test.log 推到 ci-logs 分支（我的 token 读不到 Checks API）。
# 任务完成后删。
on:
  push:
    branches: [feat/plugins]
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 跑测试
        id: t
        continue-on-error: true
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest > /tmp/test.log 2>&1
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          cp /tmp/test.log /tmp/test.keep
          grep -E '^e: |FAILED|tests completed' /tmp/test.log | head -60 || true
          exit 0
      - name: 推送结果
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .ci
          { echo "exit=${{ steps.t.outputs.code }}"; tail -c 200000 /tmp/test.keep 2>/dev/null || echo "no log"; } > .ci/test.log
          git add -f .ci/test.log
          git commit -m "ci: 单测结果（exit=${{ steps.t.outputs.code }}）" || echo "无变化"
          git push -f origin HEAD:ci-logs
