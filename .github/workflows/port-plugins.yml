name: port-plugins
# 一次性：把旧仓库 native/C（ba4ece7）的 plugins/ 目录搬过来，编译一遍，
# 把 gradle 输出写成 .ci/build.log 推到 ci-logs 分支，好远端定位编译错误。
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: 拷 plugins 目录
        run: |
          set -euo pipefail
          SHA=ba4ece7
          TMP=$(mktemp -d)
          curl -sSL -o "$TMP/src.tgz" "https://codeload.github.com/ccao43043-jpg/ai-chat-app/tar.gz/$SHA"
          tar -xzf "$TMP/src.tgz" -C "$TMP"
          SRC="$TMP/ai-chat-app-$SHA/app/src/main/java/com/aichat/app"
          test -d "$SRC/plugins" || { echo "插件目录不存在"; exit 1; }
          mkdir -p app/src/main/java/com/aichat/app
          cp -r "$SRC/plugins" app/src/main/java/com/aichat/app/
          find app/src/main/java/com/aichat/app/plugins -name '*.kt' | wc -l
          git config user.name  "ccao43043-jpg"
          git config user.email "ccao43043@gmail.com"
          chmod +x gradlew
          git add -A && git commit -m "port: 从 native/C（${SHA}）搬入 plugins/（知识库/缓存/affect/角色卡/rp）"
          git push origin HEAD:feat/plugins

      - name: 编译与单测
        id: build
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:compileDebugKotlin > /tmp/build.log 2>&1
          CODE=$?
          echo "exit=$CODE" | tee -a /tmp/build.log
          echo "code=$CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: 把日志推到 ci-logs 分支
        if: always()
        run: |
          set -euo pipefail
          git fetch origin
          git checkout -B ci-logs
          mkdir -p .ci
          tail -c 120000 /tmp/build.log > .ci/build.log || echo "no log"
          git add -f .ci/build.log
          git commit -m "ci: 编译日志（exit=${{ steps.build.outputs.code || 'unknown' }}）" || echo "无变化"
          git push -f origin ci-logs

      - name: 结果
        if: always()
        run: |
          echo "compile exit = ${{ steps.build.outputs.code }}"
          grep -E '^e: |error:|FAILURE' /tmp/build.log | head -40 || true
