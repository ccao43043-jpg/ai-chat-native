name: diag

# 一次性诊断：把 Kotlin 编译日志推到 ci-logs 分支，供本地读取（token 读不到 Actions 日志）
on:
  push:
    branches: ['w2/**']
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: compile
        run: |
          mkdir -p .ci
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin > /tmp/build.log 2>&1 || true
          tail -c 200000 /tmp/build.log > .ci/build.log
      - name: push log
        run: |
          git config user.name "ci"
          git config user.email "ci@example.com"
          git checkout -B ci-logs
          git add -f .ci/build.log
          git commit -m "diag: kotlin compile log" || true
          git push -f origin ci-logs
