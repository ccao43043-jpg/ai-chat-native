name: diag

# 一次性诊断：把 gradle 输出推到 ci-logs 分支，供无法读 Actions 日志的人读取。用完删除。
on:
  push:
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest > /tmp/build.log 2>&1
          echo "EXIT_CODE=$?" >> /tmp/build.log
          tail -c 8000 /tmp/build.log
      - name: push log
        run: |
          git config user.name 'ci-logs'
          git config user.email 'ci-logs@users.noreply.github.com'
          mkdir -p .ci
          tail -c 200000 /tmp/build.log > .ci/build.log
          git checkout -B ci-logs
          git add -f .ci/build.log
          git commit -m 'ci: build log' || true
          git push -f origin ci-logs
