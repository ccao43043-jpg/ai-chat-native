name: instrumented
# instrumented 测试（模拟器）：仅在 main 推送与手动触发时跑——PR 循环保持 ~3 分钟（评审 §6.1）。
# 本地已验证：dsh34 模拟器（API 34 / x86_64）10/10 全绿（PR #86）。
#
# 2026-11-17 加固（见 MASTER-PLAN §5.4）：
#  - 重试/日志逻辑搬到 scripts/ci/instrumented.sh：inline 多行 `|| { ... }` 会被
#    android-emulator-runner 拼成一行，报 `Syntax error: end of file unexpected (expecting "}")`
#  - 无头模拟器首启实测 411 秒，emulator-boot-timeout 提到 900s、job 提到 60 分钟
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  emu:
    runs-on: ubuntu-latest
    # 首启 ~7 分钟 + 两轮测试各 ~6 分钟，留足余量
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备 gradlew
        run: chmod +x gradlew

      - name: 模拟器上跑 instrumented 测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # AOSP(default) 镜像实测两次都在装 APK 时掉 package service（Broken pipe / Can't find service: package），
          # 换 google_apis 镜像 + 加内存/核数，配合脚本里的 wait_for_pm。
          target: google_apis
          disable-animations: true
          # 无头软件渲染首启实测 411s，默认 600s 余量偏小
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -memory 4096 -cores 4
          # 单行调用，逻辑在脚本里（失败落盘 logcat 后重试一次）
          script: bash scripts/ci/instrumented.sh

      - name: 上传测试报告与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            logcat-first-failure.txt
            uitest-tree.txt
            logcat-second-failure.txt
            uitest-tree-second.txt
          if-no-files-found: ignore
