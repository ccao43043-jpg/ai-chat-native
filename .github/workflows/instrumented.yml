name: instrumented
# instrumented 测试（模拟器）：仅在 main 推送与手动触发时跑——PR 循环保持 ~3 分钟（评审 §6.1）。
# 本地已验证：dsh34 模拟器（API 34 / x86_64）10/10 全绿（PR #86）。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  emu:
    runs-on: ubuntu-latest
    # 单次实测 ~16 分钟（软件渲染）；失败会重试一次，留够余量
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备 gradlew
        run: chmod +x gradlew

      - name: 模拟器上跑 instrumented 测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -memory 3072
          # 无头模拟器偶发安装中断（Broken pipe）：失败自动重试一次。
          # 第一次失败先把 logcat 落盘——UI 测试失败时 AppRootUiTest 会把语义树打进 logcat（tag=UITEST），
          # 没有这份日志就只能在本地复现猜原因（2026-11-17 前 4 次全红就是这么耗掉的）。
          script: |
            adb logcat -c || true
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || {
              echo "::warning::第一次 instrumented 失败，收集 logcat 后重试"
              adb logcat -d > logcat-first-failure.txt || true
              adb logcat -d -s UITEST:V > uitest-tree.txt || true
              ./gradlew --no-daemon :app:connectedDebugAndroidTest
            }

      - name: 上传测试报告与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            logcat-first-failure.txt
            uitest-tree.txt
          if-no-files-found: ignore
