name: android
# 原生线的唯一门禁：编译 + 单元测试。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备 gradlew
        run: chmod +x gradlew

      - name: 单元测试
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee /tmp/test.log

      - name: 编译 debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/apk.log

      # release 构建要跑 R8：规则写错（裁掉序列化器/枚举）只会在运行时炸，
      # 所以每次 CI 都编一次 release，把「混淆把功能弄坏」挡在合并前。
      # CI 没有 keystore.properties，这里签名回落本机 debug 证书，只为验证能编出来。
      - name: 编译 release APK（R8）
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee /tmp/rel.log

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            /tmp/test.log
            /tmp/apk.log
            /tmp/rel.log
          if-no-files-found: ignore
