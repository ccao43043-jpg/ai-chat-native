name: restore-oracle
# 一次性：把单测依赖的两份「真本」从旧仓库补回来：
#   app/src/main/assets/www   —— 旧 JS 前端，单测拿它当参照实现（不进 APK：assets.srcDirs = []）
#   tests/                    —— golden 数据与旧 JS 测试脚本
# 然后跑一遍单测，把结果推到 ci-logs。完成即删。
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[skip-restore]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: 补回参照本与 golden
        run: |
          set -euo pipefail
          SHA=66822289dac2a3814228579322d9d33578a0fe5a
          TMP=$(mktemp -d)
          curl -sSL -o "$TMP/src.tgz" "https://codeload.github.com/ccao43043-jpg/ai-chat-app/tar.gz/$SHA"
          tar -xzf "$TMP/src.tgz" -C "$TMP"
          SRC="$TMP/ai-chat-app-$SHA"
          mkdir -p app/src/main/assets
          cp -r "$SRC/app/src/main/assets/www" app/src/main/assets/
          cp -r "$SRC/tests" tests
          echo "www 文件数: $(find app/src/main/assets/www -type f | wc -l)"
          echo "tests 文件数: $(find tests -type f | wc -l)"
          git config user.name  "ccao43043-jpg"
          git config user.email "ccao43043@gmail.com"
          git add -A
          git commit -m "test: 补回 assets/www 与 tests/（单测的参照实现与 golden 数据）[skip-restore]" || echo "无变化"
          git push origin HEAD:main

      - name: 跑单测
        id: t
        continue-on-error: true
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest > /tmp/test.log 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cp /tmp/test.log /tmp/test.keep

      - name: 推送结果
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "ccao43043-jpg"
          git config user.email "ccao43043@gmail.com"
          mkdir -p .ci
          { echo "exit=${{ steps.t.outputs.code }}"; tail -c 200000 /tmp/test.keep 2>/dev/null || echo "no log"; } > .ci/test.log
          git add -f .ci/test.log
          git commit -m "ci: 单测结果（exit=${{ steps.t.outputs.code }}）[skip-restore]" || echo "无变化"
          git push -f origin HEAD:ci-logs
